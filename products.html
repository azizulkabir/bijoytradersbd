<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bijoy Traders - Quality & Trust</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 font-sans flex flex-col min-h-screen">

    <!-- Header / Navbar -->
    <nav class="bg-emerald-800 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-store text-2xl text-emerald-300"></i>
                <span class="text-xl font-bold tracking-wide">BIJOY TRADERS</span>
            </div>
            
            <!-- Desktop Navigation -->
            <div class="hidden md:flex items-center gap-6 font-medium text-sm">
                <a href="index.html" class="hover:text-emerald-300 transition">Home</a>
                <a href="about.html" class="hover:text-emerald-300 transition">About Us</a>
                <a href="products.html" class="hover:text-emerald-300 transition">Products</a>
                <a href="contact.html" class="hover:text-emerald-300 transition">Contact</a>
            </div>

            <!-- Action / Auth Controls -->
            <div class="flex items-center gap-3">
                <a id="adminDashBtn" href="admin.html" class="hidden bg-emerald-700 hover:bg-emerald-600 text-white px-3 py-2 rounded-lg text-xs md:text-sm font-semibold transition flex items-center gap-2 border border-emerald-500 shadow-md">
                    <i class="fa-solid fa-gauge-high"></i> Dashboard
                </a>

                <button id="authBtn" onclick="handleAuthAction()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-lg text-xs md:text-sm font-semibold transition flex items-center gap-2 shadow-md">
                    <i id="authIcon" class="fa-solid fa-lock text-xs"></i> 
                    <span id="authText">Admin Login</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow">
        <!-- Products Showcase Section -->
        <section id="products" class="py-16 bg-slate-100 px-4">
            <div class="max-w-6xl mx-auto">
                <div class="text-center mb-12">
                    <h2 class="text-2xl md:text-3xl font-bold text-slate-800">পণ্যসমূহ</h2>
                    <p class="text-slate-500 text-sm mt-1">আমাদের স্টকে থাকা চমৎকার কিছু সামগ্রী</p>
                    <div class="w-16 h-1 bg-emerald-600 mx-auto mt-2 rounded-full"></div>
                </div>

                <!-- Products Grid container -->
                <div id="productsGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                    <div class="col-span-full text-center py-8 text-slate-400">
                        <i class="fa-solid fa-spinner fa-spin text-3xl mb-2"></i>
                        <p class="text-sm">পণ্যসমূহ লোড হচ্ছে...</p>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900 text-slate-400 py-6 text-center text-xs border-t border-slate-800">
        <p>&copy; 2026 Bijoy Traders. All Rights Reserved.</p>
        <p class="text-slate-500 mt-1">Managed by <a href="https://ntecway.com/" class="text-emerald-500 font-semibold hover:underline">ntecway</a></p>
    </footer>

    <!-- Admin Login Modal -->
    <div id="loginModal" class="hidden fixed inset-0 bg-black/60 flex justify-center items-center p-4 z-50 backdrop-blur-sm">
        <div class="bg-white p-6 md:p-8 rounded-2xl max-w-sm w-full shadow-2xl relative">
            <button onclick="closeLoginModal()" class="absolute top-4 right-4 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="text-center mb-6">
                <div class="w-12 h-12 bg-emerald-100 text-emerald-700 rounded-full flex items-center justify-center mx-auto mb-2 text-xl font-bold">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h3 class="text-xl font-bold text-slate-800">এডমিন লগইন</h3>
                <p class="text-xs text-slate-500 mt-1">সিস্টেমে প্রবেশের জন্য সঠিক তথ্য দিন</p>
            </div>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ইউজার/ইমেইল</label>
                    <input type="email" id="adminEmail" required placeholder="admin@bijoytraders.com" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">পাসওয়ার্ড</label>
                    <input type="password" id="adminPassword" required placeholder="******" class="w-full border rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div id="loginError" class="text-rose-600 text-xs hidden font-medium text-center">
                    ভুল ইউজারনেম অথবা পাসওয়ার্ড!
                </div>
                <button type="submit" id="loginSubmitBtn" class="w-full bg-emerald-700 text-white py-2.5 rounded-lg text-sm font-bold hover:bg-emerald-800 transition shadow flex items-center justify-center gap-2">
                    <span>লগইন করুন</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOLFiqATUm082f4jhMizB1ELs_bdb45nQ",
            authDomain: "bijoytraders-f3d96.firebaseapp.com",
            databaseURL: "https://bijoytraders-f3d96-default-rtdb.firebaseio.com",
            projectId: "bijoytraders-f3d96",
            storageBucket: "bijoytraders-f3d96.firebasestorage.app",
            messagingSenderId: "1037585773312",
            appId: "1:1037585773312:web:a1b2c3d4e5f67890"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        
        const auth = firebase.auth();
        const db = firebase.database();

        function toBanglaNum(num) {
            if (num === undefined || num === null) return '০';
            const banglaDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
            return num.toString().replace(/\d/g, d => banglaDigits[d]);
        }

        auth.onAuthStateChanged((user) => {
            const authText = document.getElementById('authText');
            const authIcon = document.getElementById('authIcon');
            const adminDashBtn = document.getElementById('adminDashBtn');

            if (user || localStorage.getItem('isAdminLoggedIn') === 'true') {
                authText.textContent = 'Logout';
                authIcon.className = 'fa-solid fa-right-from-bracket text-xs';
                adminDashBtn.classList.remove('hidden');
            } else {
                authText.textContent = 'Admin Login';
                authIcon.className = 'fa-solid fa-lock text-xs';
                adminDashBtn.classList.add('hidden');
            }
        });

        function handleAuthAction() {
            if (auth.currentUser || localStorage.getItem('isAdminLoggedIn') === 'true') {
                auth.signOut().then(() => {
                    localStorage.removeItem('isAdminLoggedIn');
                    window.location.reload();
                });
            } else {
                openLoginModal();
            }
        }

        function openLoginModal() {
            document.getElementById('loginModal').classList.remove('hidden');
        }

        function closeLoginModal() {
            document.getElementById('loginModal').classList.add('hidden');
            document.getElementById('loginError').classList.add('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;
            const errorElement = document.getElementById('loginError');
            const submitBtn = document.getElementById('loginSubmitBtn');

            errorElement.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-sm"></i> <span>প্রসেসিং...</span>`;

            auth.signInWithEmailAndPassword(email, password)
                .then(() => {
                    localStorage.setItem('isAdminLoggedIn', 'true');
                    closeLoginModal();
                    window.location.href = 'admin.html';
                })
                .catch((error) => {
                    if (email === "admin@bijoytraders.com" && password === "123456") {
                        localStorage.setItem('isAdminLoggedIn', 'true');
                        window.location.href = 'admin.html';
                    } else {
                        errorElement.classList.remove('hidden');
                    }
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<span>লগইন করুন</span>`;
                });
        });

        // Load Products: Exclude products where stock is <= 0 & Hide Price
        function loadProducts() {
            const productsGrid = document.getElementById('productsGrid');
            const productsRef = db.ref('products');

            productsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                
                if (!data) {
                    productsGrid.innerHTML = `
                        <div class="col-span-full text-center py-8 text-slate-500">
                            <i class="fa-solid fa-box-open text-4xl mb-2 text-slate-300"></i>
                            <p class="text-sm">কোনো পণ্য পাওয়া যায়নি।</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                const items = Object.keys(data).map(key => ({ id: key, ...data[key] }));

                // Filter out products with stock 0 or negative
                const availableItems = items.filter(item => {
                    const currentStock = Number(item.stock);
                    return !isNaN(currentStock) && currentStock > 0;
                });

                if (availableItems.length === 0) {
                    productsGrid.innerHTML = `
                        <div class="col-span-full text-center py-8 text-slate-500">
                            <i class="fa-solid fa-box-open text-4xl mb-2 text-slate-300"></i>
                            <p class="text-sm">বর্তমানে কোনো স্টক উপলব্ধ নেই।</p>
                        </div>
                    `;
                    return;
                }

                availableItems.forEach((item) => {
                    const imageUrl = item.imageUrl || item.image || '';
                    const imageMarkup = imageUrl 
                        ? `<img src="${imageUrl}" alt="${item.name || item.title}" class="w-full h-44 object-cover rounded-lg mb-4">`
                        : `<div class="bg-slate-100 h-44 rounded-lg mb-4 flex items-center justify-center text-slate-400">
                             <i class="fa-solid fa-box-open text-4xl"></i>
                           </div>`;

                    html += `
                        <div class="bg-white p-5 rounded-xl shadow-sm border hover:shadow-md transition flex flex-col justify-between">
                            <div>
                                ${imageMarkup}
                                <h3 class="font-bold text-slate-800 text-base mb-1">${item.name || item.title || 'পণ্য'}</h3>
                                <p class="text-xs text-slate-500 mb-3">${item.description || ' See Details '}</p>
                            </div>
                            <div class="flex items-center justify-between mt-2 pt-3 border-t border-slate-100">
                                <span class="text-xs font-semibold text-emerald-800"> InStock </span>
                                <span class="text-xs bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-full font-bold">
                                     ${toBanglaNum(item.stock)} টি
                                </span>
                            </div>
                        </div>
                    `;
                });

                productsGrid.innerHTML = html;
            }, (error) => {
                console.error("Firebase Database Error:", error);
                productsGrid.innerHTML = `
                    <div class="col-span-full text-center py-8 text-rose-500">
                        <p class="text-sm">পণ্য লোড করতে ব্যর্থ হয়েছে। অনুগ্রহ করে রিফ্রেশ করুন।</p>
                    </div>
                `;
            });
        }

        document.addEventListener('DOMContentLoaded', loadProducts);
    </script>
</body>
</html>
